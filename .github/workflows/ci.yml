name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Prepare CI log directory
        run: mkdir -p .ci-logs

      - name: 1. Install dependencies (when pyproject.toml exists)
        run: |
          set -o pipefail
          if [ -f pyproject.toml ]; then
            uv sync --dev 2>&1 | tee .ci-logs/01-install.log
          else
            echo "Docs-only scaffold stage: no pyproject.toml yet." | tee .ci-logs/01-install.log
          fi

      - name: 2. Format & Lint
        run: |
          set -o pipefail
          if [ -f pyproject.toml ]; then
            uv run ruff check . 2>&1 | tee .ci-logs/02-format-lint.log
            uv run ruff format --check . 2>&1 | tee -a .ci-logs/02-format-lint.log
          else
            echo "Skipped until src/ exists." | tee .ci-logs/02-format-lint.log
          fi

      - name: 3. Static Type Check
        run: |
          set -o pipefail
          if [ -f pyproject.toml ]; then
            uv run mypy src tests 2>&1 | tee .ci-logs/03-typecheck.log
          else
            echo "Skipped until src/ exists." | tee .ci-logs/03-typecheck.log
          fi

      - name: 4. Unit & Integration Tests
        run: |
          set -o pipefail
          if [ -f pyproject.toml ]; then
            uv run pytest -q 2>&1 | tee .ci-logs/04-tests.log
          else
            echo "Skipped until tests/ exists." | tee .ci-logs/04-tests.log
          fi

      - name: 5. Structure & Doc Parity Checks
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .ci-logs/05-structure-docs.log
          import pathlib, re
          docs = sorted(pathlib.Path("docs").glob("*.md"))
          assert docs, "docs/ must contain Markdown docs"
          header_re = re.compile(r"^### \[(FEATURE|WISHLIST|SUBSYSTEM|FLOW|DECISION|TRAP): [^\]]+\]")
          for d in docs:
              lines = d.read_text(encoding="utf-8").splitlines()
              for idx, line in enumerate(lines):
                  if header_re.match(line):
                      assert idx + 1 < len(lines) and lines[idx + 1].startswith("> **1-Line Summary:**"), (
                          f"{d}:{idx+1} missing immediate '> **1-Line Summary:**' line"
                      )
          print(f"Verified {len(docs)} doc files cleanly.")
          PY

      - name: Generate patch-ready CI failure report
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re, subprocess
          repo_slug = os.environ.get("GITHUB_REPOSITORY", "Mostakim2005/rag-manager").split("/")[-1]
          repo_title = " ".join(w.capitalize() for w in re.split(r"[-_]+", repo_slug) if w) or repo_slug
          report_dir = pathlib.Path(".ci-report")
          report_dir.mkdir(exist_ok=True)
          report_path = report_dir / f"{repo_title} - CI Failure Report.md"
          def run_cmd(cmd):
              return subprocess.run(cmd, capture_output=True, text=True).stdout.strip()
          sha = os.environ.get("GITHUB_SHA", "unknown")
          sections = [
              f"# {repo_title} - CI Failure Report",
              "",
              f"- Repository: `{os.environ.get('GITHUB_REPOSITORY', '')}`",
              f"- Branch: `{os.environ.get('GITHUB_REF_NAME', 'unknown')}`",
              f"- Commit: `{sha[:8]}` — {run_cmd(['git', 'log', '-1', '--pretty=%s'])}",
              f"- Generated: {datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}",
              "",
              "## Stage Logs",
          ]
          for lf in sorted(pathlib.Path(".ci-logs").glob("*.log")):
              sections.extend([f"### `{lf.name}`", "```text", lf.read_text(encoding="utf-8", errors="replace")[-8000:], "```", ""])
          report_path.write_text("\n".join(sections) + "\n", encoding="utf-8")
          PY

      - name: Upload patch-ready CI failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report
          path: .ci-report/*.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
